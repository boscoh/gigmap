<!DOCTYPE html>
<html lang="en">
<head>
  <!-- avoid text rendering issues on various platforms -->
  <meta charset="utf-8"/>

  <!-- prevent auto-zooming on mobile browsers -->
  <meta name="viewport" content="width=device-width, initial-scale=1"/>

  <!-- The server fills these from the source (beat.SOURCE). -->
  <title>__SOURCE_TITLE__</title>
  <script>window.SOURCE = __SOURCE_INFO__;</script>

  <!-- Bootstrap -->
  <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.0.1/dist/css/bootstrap.min.css"
      rel="stylesheet"
  />
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.0.1/dist/js/bootstrap.bundle.min.js"></script>

  <!-- Title font: Anton, a condensed display face -->
  <link rel="preconnect" href="https://fonts.googleapis.com"/>
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
  <link
      href="https://fonts.googleapis.com/css2?family=Anton&display=swap"
      rel="stylesheet"
  />

  <!-- Font Awesome -->
  <link
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.15.1/css/all.min.css"
      rel="stylesheet"
  />

  <!-- Pug template compiler -->
  <script src="https://pugjs.org/js/pug.js"></script>
  <script>
      window.pug = require("pug");

      function renderHtmlFromPug(str) {
          const lines = str.replace(/^\n/, "").split("\n");
          const minIndent = Math.min(
              ...lines.filter((l) => l.trim()).map((l) => l.match(/^\s*/)[0].length),
          );
          return pug.render(lines.map((l) => l.slice(minIndent)).join("\n"), {doctype: 'html'});
      }
  </script>

  <!-- Lodash -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/lodash.js/4.17.20/lodash.min.js"></script>

  <!-- Vue 3 -->
  <script src="https://unpkg.com/vue@3/dist/vue.global.js"></script>

  <!-- Ky: one instance for every API call, with a shared base path and
       error messages read from the server's JSON body. -->
  <script type="module">
      import ky from "https://unpkg.com/ky@2.2.0/distribution/index.js";

      // The server sends FastAPI errors as JSON. `detail` is a string or a
      // list of objects with a `msg` field. ky v2 reads the body into
      // `error.data` before the hook runs, so the response body is gone.
      function readServerDetail(error) {
          const detail = error?.data?.detail;
          if (typeof detail === "string") {
              return detail;
          }
          if (Array.isArray(detail)) {
              return detail.map((item) => item.msg || String(item)).join("; ");
          }
          return "";
      }

      window.api = ky.create({
          prefix: "/api",
          hooks: {
              beforeError: [
                  async ({error}) => {
                      const {response} = error;
                      if (response) {
                          const detail = readServerDetail(error);
                          error.message = detail || `server answered status ${response.status}`;
                      }
                      return error;
                  },
              ],
          },
      });
  </script>

  <!-- Leaflet: the OSM embed supports one marker only, so use a slippy map -->
  <link
      href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
      rel="stylesheet"
  />
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

  <style>

      }

          }
      }

      .app-shell {
          height: 100vh;
      }

      .gig-scroll {
          overflow: auto;
      }

      .gig-frame {
          display: contents;
      }

      .gig-scroll thead th {

      }

      button.status-chip:hover:not(:disabled) {

          color: #212529;
      }

      button.status-chip:disabled {
          cursor: default;
          opacity: 1;
      }

      .splitter {
          display: flex;
          flex: 0 0 0.75rem;
          justify-content: center;
          cursor: col-resize;
          touch-action: none;
          user-select: none;

      .splitter::before {

      .gig-popup {

      .skeleton {

          border-radius: 0.25rem;

      @keyframes skeleton-pulse {

      .gig-table a:not(.btn) {

      }

      .gig-table a:not(.btn):hover {

      }

      .gig-table a.gig-link {

      }

      .gig-table a.gig-link:hover {

              flex: 1 1 0;

      @media (max-width: 991.98px) {
          .app-shell {
              height: auto;
          }

          .gig-scroll {
              max-height: 75vh;
          }

          .map-wrap {
              flex: 0 0 auto;
              height: calc(22rem - 50px);
          }

          .splitter {
              flex: 0 0 2.25rem;
              pointer-events: none;
          }

              display: none;
          }

              overflow: hidden;
              border: 1px solid #dee2e6;

          .gig-frame::after {
              content: "";
              position: absolute;

              right: 0;

              height: 0.75rem;
              z-index: 2;
              pointer-events: none;

  </style>
</head>

<body>
<div id="app"></div>
</body>

<script>
    // The server writes the source details into <head>.
    const SOURCE = window.SOURCE;
    /* language=pug */
    let template = renderHtmlFromPug(/* pug */`
      .container-fluid.py-3.app-shell.d-flex.flex-column.flex-lg-row.gap-lg-2
        .gig-side.mb-lg-0(:style="sideWidth ? {'--side-width': sideWidth + 'px'} : null")

              template(v-if="isNarrow")
                h1.mb-0.text-nowrap
                  | ${SOURCE.title}
                .text-muted(style="font-size: 0.7rem")
                  | Data @ 
                  a.me-2(
                      href="${SOURCE.home_url}",
                      target="_blank",
                      rel="noopener",

              .d-flex.flex-nowrap.gap-2(v-if="!isNarrow")
                button.calendar-day(
                  v-for="range in ranges",

                  type="button",
                  :class="{'calendar-selected': range.id === active}",

                )
                  | {{ range.label }}

              .mt-1

              .d-flex.flex-row.small.text-muted
                button.status-chip(
                  type="button",
                  :disabled="loading",
                  @click="refresh()",
                  title="Refresh"
                )
                  i.fas.fa-sync-alt(:class="busy ? 'fa-spin' : ''")
                span.status-chip(v-if="startDate && statusText")
                  | {{ statusText }}

              .venue-group
                .text-muted.small(v-if="!selectedGig")
                  | Click a row to focus a venue.

                div.venue-name(v-if="selectedGig")
                  | {{ selectedGig.venue }}
                .text-muted.small(v-if="venue.loading")
                  | Looking up the address...
                .text-danger.small(v-if="venue.error")
                  | {{ venue.error }}
                .small.venue-address(v-if="venue.data && venue.data.address")
                  | {{ venue.data.address }}

            .calendar
              .calendar-head.d-flex.align-items-center.justify-content-between
                button.btn.btn-sm.btn-outline-secondary.border-0(
                  type="button",
                  @click="shiftMonth(-1)",
                  title="Previous month"
                )
                  i.fas.fa-chevron-left
                .small.fw-bold {{ calendarTitle }}
                button.btn.btn-sm.btn-outline-secondary.border-0(
                  type="button",
                  @click="shiftMonth(1)",
                  title="Next month"
                )
                  i.fas.fa-chevron-right
              .calendar-grid
                .calendar-weekday(v-for="name in calendarWeekdays", :key="name")
                  | {{ name }}
                .calendar-day(
                  v-for="(cell, index) in calendarCells",
                  :key="index",
                  :class="{'calendar-empty': !cell, 'calendar-past': cell && cell.iso < todayIso, 'calendar-today': cell && cell.iso === todayIso, 'calendar-selected': cell && cell.iso === startDate && cell.iso === endDate}",
                  @click="cell && cell.iso >= todayIso && pickDay(cell.iso)"
                )
                  | {{ cell ? cell.day : "" }}

          .text-muted.mt-3(style="font-size: 0.7rem")
            | Coordinates © 
            a(
              href="https://www.openstreetmap.org/copyright",
              target="_blank",
              rel="noopener"
            ) OpenStreetMap contributors
            | , via 
            a(
              href="https://nominatim.openstreetmap.org/",
              target="_blank",
              rel="noopener"
            ) Nominatim

          .map-wrap.mt-2
            div#map

        .splitter(@pointerdown="startDrag", title="Drag to resize")
        .gig-frame(:class="frameClass")
          .gig-scroll.flex-grow-1(style="min-height: 0", @scroll="updateScrollEdges")

            .alert.alert-danger(v-if="error")
              | {{ error }}

            table.table.table-sm.table-hover.align-top.mb-0.gig-table(v-if="loading || gigs.length")
              colgroup
                col(style="width: 5rem")
                col.artist-col(:style="isNarrow ? {} : {width: '50%'}")
                col.venue-col(v-if="!isNarrow")

              thead
                tr
                  th.sortable(@click="toggleSort('time')")
                    | Time
                    i.fas.ms-1(v-if="sortKey === 'time'", :class="sortDir === 'asc' ? 'fa-caret-up' : 'fa-caret-down'")
                  th.sortable(@click="toggleSort('artist')")
                    | Artist
                    i.fas.ms-1(v-if="sortKey === 'artist'", :class="sortDir === 'asc' ? 'fa-caret-up' : 'fa-caret-down'")
                  th.sortable.venue-col(v-if="!isNarrow", @click="toggleSort('venue')")
                    | Venue
                    i.fas.ms-1(v-if="sortKey === 'venue'", :class="sortDir === 'asc' ? 'fa-caret-up' : 'fa-caret-down'")
                  th.sortable(@click="toggleSort('price')")
                    | Ticket
                    i.fas.ms-1(v-if="sortKey === 'price'", :class="sortDir === 'asc' ? 'fa-caret-up' : 'fa-caret-down'")
              tbody
                template(v-if="loading")
                  tr(v-for="row in 6", :key="row")

                      .skeleton
                    td

                  @click="selectGig(gig, $event)"
                )
                  td
                    div(v-if="gig.time")
                      | {{ gig.time }}
                    div.text-muted(style="font-size: 0.7rem")
                      | {{ formatDate(gig.date) }}
                    div.text-muted(style="font-size: 0.7rem", v-if="gig.end_date")
                      | → {{ formatDate(gig.end_date) }}
                  td
                    .artist-line
                      span.artist-name
                        | {{ gig.artist }}
                      span.artist-icons

                        )
                          i.fas.fa-link.text-muted(style="font-size: 0.8rem")
                        a.ms-2(
                          v-if="gig.artist",
                          :href="searchUrl(gig)",
                          target="_blank",
                          rel="noopener",
                          title="Search the web for this artist"
                        )
                          i.fas.fa-search.text-muted(style="font-size: 0.8rem")
                    div.text-muted(style="font-size: 0.7rem")
                      | {{ tagLine(gig) }}
                  td.venue-col(v-if="!isNarrow")
                    .venue-line
                      span.venue-name
                        | {{ gig.venue }}
                      span.venue-icons
                        a.ms-2(
                          v-if="gig.venue_url",
                          :href="gig.venue_url",
                          target="_blank",
                          rel="noopener",
                          title="Open the venue page on beat.com.au"
                        )
                          i.fas.fa-link.text-muted(style="font-size: 0.8rem")
                  td
                    a.btn.btn-sm.btn-outline-primary(
                      v-if="gig.ticket_url",
                      :href="gig.ticket_url",
                      target="_blank",
                      rel="noopener"
                    ) {{ gig.price || "Tickets" }}
                    span.text-muted.small(v-if="!gig.ticket_url") {{ gig.price }}

            .scroll-room
            .text-muted.text-center.py-4(v-if="!gigs.length && !loading && startDate")
              | No gigs in this range.
    `);

    const {createApp, ref, computed, nextTick, onMounted, watch} = Vue;

    const CALENDAR_WEEKDAYS = ["Su", "Mo", "Tu", "We", "Th", "Fr", "Sa"];

    function weekdayShort(offsetDays) {
        const date = new Date();
        date.setDate(date.getDate() + offsetDays);
        return CALENDAR_WEEKDAYS[date.getDay()];
    }

    function buildRanges() {
        const ranges = [
            {id: "today", label: "Today", from: 0, to: 0},
            {id: "tomorrow", label: "Tmrw", from: 1, to: 1},
        ];
        for (let offset = 2; offset < 7; offset += 1) {
            ranges.push({
                id: `day-${offset}`,
                label: weekdayShort(offset),
                from: offset,
                to: offset,
            });
        }
        return ranges;
    }

    const RANGES = buildRanges();

    function isoDate(offsetDays) {
        const date = new Date();
        date.setDate(date.getDate() + offsetDays);
        const month = String(date.getMonth() + 1).padStart(2, "0");
        const day = String(date.getDate()).padStart(2, "0");
        return `${date.getFullYear()}-${month}-${day}`;
    }

    const MONTHS = [
        "Jan", "Feb", "Mar", "Apr", "May", "Jun",
        "Jul", "Aug", "Sep", "Oct", "Nov", "Dec",
    ];

    const MELBOURNE = [-37.8136, 144.9631];

    // The OpenStreetMap standard tiles: a short credit and no API key. This
    // tile server does not serve retina tiles, so the URL has no {r}.
    const TILE_URL = "https://tile.openstreetmap.org/{z}/{x}/{y}.png";
    const TILE_ATTRIBUTION =
        '&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a> ' +
        "contributors";

    function escapeHtml(value) {
        return String(value == null ? "" : value)
            .replaceAll("&", "&amp;")
            .replaceAll("<", "&lt;")
            .replaceAll(">", "&gt;");
    }

    function formatDate(value) {
        if (!value) {
            return "";
        }
        const parts = value.split("-");
        if (parts.length !== 3) {
            return value;
        }
        const monthName = MONTHS[Number(parts[1]) - 1];
        return monthName ? `${Number(parts[2])} ${monthName}` : value;
    }

    function tagLine(gig) {
        const tags = [...gig.categories, ...gig.genres];
        const words = [];
        for (const tag of tags) {
            for (const part of String(tag).split("/")) {
                const word = part.trim();
                if (word) {
                    words.push(word);
                }
            }
        }
        return words.join(" / ");
    }

    function searchUrl(gig) {
        const query = [gig.artist, ...(gig.categories || []), ...(gig.genres || [])].filter(Boolean).join(" ");
        return `https://www.google.com/search?q=${encodeURIComponent(query)}`;
    }

    async function fetchGigs(startDate, endDate, refresh) {
        const searchParams = {start_date: startDate, end_date: endDate};
        if (refresh) {
            searchParams.refresh = "true";
        }
        return window.api.get("gigs", {searchParams, timeout: 120000}).json();
    }

    async function fetchVenue(venueUrl) {
        const searchParams = {venue_url: venueUrl};
        return window.api.get("venue", {searchParams, timeout: 60000}).json();
    }

    function setup() {
        const ranges = ref(RANGES);
        const active = ref("");
        const startDate = ref("");
        const endDate = ref("");
        const gigs = ref([]);
        const loading = ref(false);
        const error = ref("");
        const currentRange = ref(null);
        const selectedGig = ref(null);
        const venue = ref({loading: false, data: null, error: ""});
        const mapping = ref(false);
        const mapped = ref(0);
        const toMap = ref(0);
        const markerCount = ref(0);
        const timing = ref(false);
        const timesLoaded = ref(0);
        const timesTotal = ref(0);
        let timeRun = 0;
        let timeSource = null;
        const narrowScreen = window.matchMedia("(max-width: 991.98px)");
        const isNarrow = ref(narrowScreen.matches);
        narrowScreen.addEventListener("change", (event) => {
            isNarrow.value = event.matches;
        });
        let mapRun = 0;
        let loadRun = 0;
        const activeVenueUrl = ref("");
        const venueInfo = new Map();
        let venueRequest = 0;
        let map = null;
        const markers = new Map();

        const sideWidth = ref(null);
        let dragStartX = 0;
        let dragStartWidth = 0;

        function startDrag(event) {
            const side = document.querySelector(".gig-side");
            if (!side) {
                return;
            }
            dragStartX = event.clientX;
            dragStartWidth = side.getBoundingClientRect().width;
            window.addEventListener("pointermove", onDrag);
            window.addEventListener("pointerup", stopDrag);
            event.preventDefault();
        }

        function onDrag(event) {
            const min = 240;
            const max = Math.max(min, window.innerWidth - 320);
            const wanted = dragStartWidth + (event.clientX - dragStartX);
            sideWidth.value = Math.min(max, Math.max(min, wanted));
        }

        function stopDrag() {
            window.removeEventListener("pointermove", onDrag);
            window.removeEventListener("pointerup", stopDrag);
        }

        const calendarCursor = ref(new Date());
        const todayIso = isoDate(0);

        function shiftMonth(delta) {
            const cursor = calendarCursor.value;
            calendarCursor.value = new Date(cursor.getFullYear(), cursor.getMonth() + delta, 1);
        }

        function pickDay(iso) {
            const range = RANGES.find(
                (item) => (item.start || isoDate(item.from)) === iso,
            );
            load(range || {id: `date-${iso}`, start: iso, end: iso});
        }

        const calendarTitle = computed(() =>
            calendarCursor.value.toLocaleString("en-AU", {month: "long", year: "numeric"})
        );

        const calendarCells = computed(() => {
            const cursor = calendarCursor.value;
            const year = cursor.getFullYear();
            const month = cursor.getMonth();
            const startOffset = new Date(year, month, 1).getDay();
            const daysInMonth = new Date(year, month + 1, 0).getDate();
            const cells = [];
            for (let index = 0; index < startOffset; index += 1) {
                cells.push(null);
            }
            for (let day = 1; day <= daysInMonth; day += 1) {
                const monthText = String(month + 1).padStart(2, "0");
                const dayText = String(day).padStart(2, "0");
                cells.push({iso: `${year}-${monthText}-${dayText}`, day});
            }
            return cells;
        });

        async function load(range, force = false) {
            loadRun += 1;
            const runId = loadRun;
            active.value = range.id;
            currentRange.value = range;
            startDate.value = range.start || isoDate(range.from);
            endDate.value = range.end || isoDate(range.to);
            loading.value = true;
            error.value = "";
            selectedGig.value = null;
            venue.value = {loading: false, data: null, error: ""};
            if (map) {
                for (const marker of markers.values()) {
                    marker.remove();
                }
                markers.clear();
            }
            mapRun += 1;
            markerCount.value = 0;
            activeVenueUrl.value = "";
            venueInfo.clear();
            mapped.value = 0;
            toMap.value = 0;
            stopTimes();
            scrollRoom(0);
            try {
                const data = await fetchGigs(startDate.value, endDate.value, force);
                if (runId !== loadRun) {
                    return;
                }
                gigs.value = data;
                mapAllVenues();
                loadTimes(force);
            } catch (problem) {
                if (runId !== loadRun) {
                    return;
                }
                gigs.value = [];
                error.value = `Could not load the gig guide: ${problem.message}`;
            } finally {
                if (runId === loadRun) {
                    loading.value = false;
                }
            }
        }

        function stopTimes() {
            timeRun += 1;
            if (timeSource) {
                timeSource.abort();
                timeSource = null;
            }
            timing.value = false;
        }

        async function loadTimes(force = false) {
            stopTimes();
            const runId = timeRun;
            const searchParams = {start_date: startDate.value, end_date: endDate.value};
            if (force) {
                searchParams.refresh = "true";
            }
            timeSource = new AbortController();
            timing.value = true;
            timesLoaded.value = 0;
            timesTotal.value = gigs.value.length;

            function applyLine(line) {
                if (!line.trim()) {
                    return;
                }
                const update = JSON.parse(line);
                const gig = gigs.value[update.index];
                if (gig) {
                    gig.time = update.time;
                    timesLoaded.value += 1;
                }
            }

            try {
                const response = await window.api.get("times", {
                    searchParams,
                    timeout: false,
                    signal: timeSource.signal,
                });
                if (!response.body) {
                    throw new Error("server sent no response body");
                }
                const reader = response.body.getReader();
                const decoder = new TextDecoder();
                let buffer = "";
                let done = false;
                while (!done && runId === timeRun) {
                    const chunk = await reader.read();
                    done = chunk.done;
                    buffer += decoder.decode(chunk.value, {stream: true});
                    const lines = buffer.split("\n");
                    buffer = lines.pop();
                    for (const line of lines) {
                        applyLine(line);
                    }
                }
                if (runId === timeRun) {
                    applyLine(buffer);
                }
            } catch (problem) {
                if (problem.name !== "AbortError") {
                    console.error("time lookup failed", problem);
                }
            } finally {
                if (runId === timeRun) {
                    timing.value = false;
                }
            }
        }

        function timeValue(time) {
            const match = /^(\d{1,2})(?::(\d{2}))?(am|pm)$/.exec(String(time || "").trim().toLowerCase());
            if (!match) {
                return Number.MAX_SAFE_INTEGER;
            }
            let hour = Number(match[1]) % 12;
            if (match[3] === "pm") {
                hour += 12;
            }
            return hour * 60 + Number(match[2] || 0);
        }

        const sortKey = ref("time");
        const sortDir = ref("asc");

        function toggleSort(key) {
            if (sortKey.value === key) {
                sortDir.value = sortDir.value === "asc" ? "desc" : "asc";
            } else {
                sortKey.value = key;
                sortDir.value = "asc";
            }
        }

        function priceValue(price) {
            const match = /([0-9]+(?:\.[0-9]+)?)/.exec(String(price || ""));
            return match ? Number(match[1]) : Number.MAX_SAFE_INTEGER;
        }

        function compareGigs(left, right) {
            const direction = sortDir.value === "asc" ? 1 : -1;
            if (sortKey.value === "time") {
                const dateOrder = String(left.date || "").localeCompare(String(right.date || ""));
                if (dateOrder !== 0) {
                    return dateOrder * direction;
                }
                if (!left.time && !right.time) {
                    return 0;
                }
                if (!left.time) {
                    return 1;
                }
                if (!right.time) {
                    return -1;
                }
                return (timeValue(left.time) - timeValue(right.time)) * direction;
            }
            if (sortKey.value === "price") {
                return (priceValue(left.price) - priceValue(right.price)) * direction;
            }
            return String(left[sortKey.value] || "").localeCompare(String(right[sortKey.value] || "")) * direction;
        }

        const visibleGigs = computed(() => {
            if (!sortKey.value) {
                return gigs.value;
            }
            return [...gigs.value].sort(compareGigs);
        });

        const visibleRows = computed(() => (loading.value ? [] : visibleGigs.value));
        watch([visibleRows, loading], () => nextTick(updateScrollEdges));

        const busy = computed(() => loading.value || timing.value || mapping.value);

        const gigsText = computed(() => {
            if (timing.value && timesTotal.value) {
                return `${timesLoaded.value}/${timesTotal.value} gigs`;
            }
            if (loading.value || !gigs.value.length) {
                return "";
            }
            return `${gigs.value.length} gigs`;
        });

        const venuesText = computed(() => {
            if (mapping.value && toMap.value) {
                return `in ${mapped.value}/${toMap.value} venues`;
            }
            if (loading.value || !markerCount.value) {
                return "";
            }
            return `in ${markerCount.value} venues`;
        });

        const statusText = computed(
            () => [gigsText.value, venuesText.value].filter(Boolean).join(" "),
        );

        function actsAt(venueUrl) {
            const acts = [];
            for (const gig of gigs.value) {
                if (gig.venue_url !== venueUrl || !gig.artist) {
                    continue;
                }
                acts.push({
                    time: gig.time || "",
                    artist: gig.artist,
                    order: timeValue(gig.time),
                });
            }
            acts.sort((left, right) => left.order - right.order);
            return acts;
        }

        function addMarker(data) {
            if (!map || !data.latitude || !data.longitude) {
                return;
            }
            const marker =
                markers.get(data.venue_url) ||
                L.marker([data.latitude, data.longitude]).addTo(map);
            const name = escapeHtml(data.name || "Venue");
            const address = escapeHtml(data.address || "");
            const acts = actsAt(data.venue_url);
            let popup = '<table class="gig-popup">';
            for (const act of acts) {
                popup += `<tr><td>${escapeHtml(act.time)}</td><td>${escapeHtml(act.artist)}</td></tr>`;
            }
            popup += '<tr class="gig-popup-venue"><td>Venue</td>';
            popup += `<td>${name}${address ? `<br>${address}` : ""}</td></tr>`;
            popup += "</table>";
            marker.bindPopup(popup);
            marker.on("click", () => focusVenue(data.venue_url));
            markers.set(data.venue_url, marker);
            venueInfo.set(data.venue_url, data);
            markerCount.value = markers.size;
        }

        // The narrow layout shows a shadow on an edge when rows are hidden past it.
        const scrollEdges = ref({above: false, below: false});
        const frameClass = computed(() => ({
            "has-above": scrollEdges.value.above,
            "has-below": scrollEdges.value.below,
        }));

        function updateScrollEdges() {
            const scroller = document.querySelector(".gig-scroll");
            if (!scroller) {
                return;
            }
            const above = scroller.scrollTop > 1;
            const below = scroller.scrollTop + scroller.clientHeight < scroller.scrollHeight - 1;
            if (above !== scrollEdges.value.above || below !== scrollEdges.value.below) {
                scrollEdges.value = {above, below};
            }
        }

        function scrollRoom(pixels) {
            // Only the narrow layout needs room below the last row.
            const room = document.querySelector(".scroll-room");
            if (room) {
                room.style.height = isNarrow.value ? `${Math.max(0, pixels)}px` : "0px";
            }
            updateScrollEdges();
        }

        const smoothScroll =
            "scrollBehavior" in document.documentElement.style;

        // A touch after the tap means the reader moved the list. Do not move
        // the list again after the venue lookup in that case.
        let touched = false;
        window.addEventListener(
            "touchstart",
            () => {
                touched = true;
            },
            {passive: true},
        );

        function scrollContainer(element, top) {
            const target = Math.round(top);
            if (!smoothScroll) {
                element.scrollTop = target;
                return;
            }
            element.scrollTo({top: target, behavior: "smooth"});
            // iOS Safari can discard a programmatic scroll while a momentum
            // scroll runs. Correct the value when the scroll stops.
            let timer = 0;
            const stop = () => {
                element.removeEventListener("scrollend", check);
                element.removeEventListener("touchstart", stop);
                clearTimeout(timer);
            };
            const check = () => {
                stop();
                if (Math.abs(element.scrollTop - target) > 2) {
                    element.scrollTop = target;
                }
            };
            element.addEventListener("scrollend", check);
            element.addEventListener("touchstart", stop, {passive: true});
            timer = setTimeout(stop, 1500);
        }

        // The narrow layout scrolls the page as well as the list box. Move the
        // page only when the top of the list box is above the screen.
        function scrollPageToList(scroller) {
            if (!isNarrow.value) {
                return;
            }
            const top = scroller.getBoundingClientRect().top;
            if (top >= 0) {
                return;
            }
            const target = Math.round(window.scrollY + top - 4);
            if (smoothScroll) {
                window.scrollTo({top: target, behavior: "smooth"});
            } else {
                window.scrollTo(0, target);
            }
        }

        // The distance from the top of the row to the top of the list box.
        // The sticky header fills the space when the row is at the top.
        function rowGap(row, scroller) {
            const head = scroller.querySelector("thead");
            const offset = head ? head.getBoundingClientRect().height : 0;
            return row.getBoundingClientRect().top
                - scroller.getBoundingClientRect().top
                - offset;
        }

        // Put the row at the top of the list box. Move the page when the top of
        // the box is above the screen, so the row stays visible.
        function alignRowToTop(row) {
            const scroller = document.querySelector(".gig-scroll");
            if (!row || !scroller) {
                return;
            }
            scrollPageToList(scroller);
            const delta = rowGap(row, scroller);
            if (Math.abs(delta) > 1) {
                scrollContainer(scroller, scroller.scrollTop + delta);
            }
        }

        function scrollRowToTop(row) {
            const scroller = document.querySelector(".gig-scroll");
            if (!row || !scroller) {
                return;
            }
            const head = scroller.querySelector("thead");
            const offset = head ? head.getBoundingClientRect().height : 0;
            // Measure the table alone, so the room is exact.
            scrollRoom(0);
            if (scroller.scrollHeight <= scroller.clientHeight) {
                return;
            }
            const short = row.getBoundingClientRect().top
                - scroller.getBoundingClientRect().top
                + scroller.scrollTop
                - offset
                - (scroller.scrollHeight - scroller.clientHeight);
            scrollRoom(short);
            // Read again: the room changed the scroll limit.
            alignRowToTop(row);
        }

        function scrollToVenue(venueUrl) {
            for (const row of document.querySelectorAll("tbody tr")) {
                if (row.dataset.venueUrl !== venueUrl) {
                    continue;
                }
                if (isNarrow.value) {
                    scrollRowToTop(row);
                } else {
                    row.scrollIntoView({block: "center", behavior: "smooth"});
                }
                return;
            }
        }

        async function focusVenue(venueUrl) {
            activeVenueUrl.value = venueUrl;
            const gig = gigs.value.find((item) => item.venue_url === venueUrl);
            if (gig) {
                selectedGig.value = gig;
            }
            const data = venueInfo.get(venueUrl);
            if (data) {
                venue.value = {loading: false, data, error: ""};
            }
            // The venue name and the address changed the height above the
            // list. Measure after Vue writes the change to the page.
            await nextTick();
            scrollToVenue(venueUrl);
        }

        function fitVenues() {
            if (markers.size === 0) {
                return;
            }
            const group = L.featureGroup([...markers.values()]);
            map.fitBounds(group.getBounds().pad(0.15));
        }

        async function mapAllVenues() {
            mapRun += 1;
            const runId = mapRun;
            const urls = [];
            for (const gig of gigs.value) {
                if (gig.venue_url && !urls.includes(gig.venue_url)) {
                    urls.push(gig.venue_url);
                }
            }
            mapping.value = true;
            mapped.value = 0;
            toMap.value = urls.length;
            try {
                // One request at a time. The server holds the geocoder to
                // one request per second for the same reason.
                for (const url of urls) {
                    if (runId !== mapRun) {
                        return;
                    }
                    try {
                        addMarker(await fetchVenue(url));
                    } catch (problem) {
                        console.error("venue lookup failed", url, problem);
                    }
                    mapped.value += 1;
                }
                fitVenues();
            } finally {
                mapping.value = false;
            }
        }

        async function selectGig(gig, event) {
            selectedGig.value = gig;
            activeVenueUrl.value = gig.venue_url || "";
            const row = isNarrow.value && event ? event.currentTarget : null;
            // The tap fires touchstart before click. Clear the mark, so a
            // later touch can cancel the correction below.
            touched = false;
            if (!gig.venue_url) {
                venue.value = {
                    loading: false,
                    data: null,
                    error: "This gig has no venue link.",
                };
                if (row) {
                    await nextTick();
                    scrollRowToTop(row);
                }
                return;
            }
            venueRequest += 1;
            const requestId = venueRequest;
            venue.value = {loading: true, data: null, error: ""};
            if (row) {
                // The summary above the list changed height. Measure after
                // Vue writes the change to the page.
                await nextTick();
                scrollRowToTop(row);
            }
            try {
                const data = await fetchVenue(gig.venue_url);
                if (venueRequest !== requestId) {
                    return;
                }
                venue.value = {loading: false, data, error: ""};
                if (row && !touched) {
                    // The address changed the height above the list again.
                    await nextTick();
                    alignRowToTop(row);
                }
                addMarker(data);
                if (data.latitude && data.longitude) {
                    map.setView([data.latitude, data.longitude], 16);
                    markers.get(data.venue_url).openPopup();
                }
            } catch (problem) {
                if (venueRequest === requestId) {
                    const message = `Could not load the venue: ${problem.message}`;
                    venue.value = {loading: false, data: null, error: message};
                    if (row && !touched) {
                        await nextTick();
                        alignRowToTop(row);
                    }
                }
            }
        }

        function refresh() {
            if (currentRange.value) {
                load(currentRange.value, true);
            }
        }

        onMounted(() => {
            map = L.map("map").setView(MELBOURNE, 11);
            L.tileLayer(TILE_URL, {
                maxZoom: 19,
                attribution: TILE_ATTRIBUTION,
            }).addTo(map);
            new ResizeObserver(() => {
                window.requestAnimationFrame(() => map.invalidateSize());
            }).observe(document.getElementById("map"));
            load(RANGES.find((range) => range.id === "today") || RANGES[0]);
            new ResizeObserver(updateScrollEdges).observe(document.querySelector(".gig-scroll"));
        });

        return {
            ranges,
            active,
            startDate,
            endDate,
            gigs,
            loading,
            error,
            load,
            refresh,
            selectedGig,
            venue,
            selectGig,
            mapping,
            mapped,
            toMap,
            timing,
            timesLoaded,
            timesTotal,
            isNarrow,
            markerCount,
            sideWidth,
            frameClass,
            updateScrollEdges,
            startDrag,
            activeVenueUrl,
            formatDate,
            tagLine,
            searchUrl,
            sortKey,
            sortDir,
            toggleSort,
            visibleGigs,
            visibleRows,
            busy,
            statusText,
            calendarTitle,
            calendarCells,
            calendarWeekdays: CALENDAR_WEEKDAYS,
            todayIso,
            shiftMonth,
            pickDay
        };
    
    }
    
    document.addEventListener("DOMContentLoaded", () => {
        createApp({template, setup}).mount("#app");
    });
</script>
</html>
