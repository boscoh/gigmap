  <script>
      window.pug = require("pug");

      function renderHtmlFromPug(str) {
          const lines = str.replace(/^\n/, "").split("\n");
          const minIndent = Math.min(
              ...lines.filter((l) => l.trim()).map((l) => l.match(/^\s*/)[0].length),
          );
          return pug.render(lines.map((l) => l.slice(minIndent)).join("\n"), {doctype: 'html'});
      }

  <!-- Ky: one instance for every API call, with a shared base path and
       error messages read from the server's JSON body. -->
  <script type="module">
      import ky from "https://unpkg.com/ky@2.2.0/distribution/index.js";

      // The server sends FastAPI errors as JSON. `detail` is a string or a
      // list of objects with a `msg` field. ky v2 reads the body into
      // `error.data` before the hook runs, so the response body is gone.
      function readServerDetail(error) {
          const detail = error?.data?.detail;
          if (typeof detail === "string") {
              return detail;
          }
          if (Array.isArray(detail)) {
              return detail.map((item) => item.msg || String(item)).join("; ");
          }
          return "";
      }

      window.api = ky.create({
          prefix: window.API_BASE,
          hooks: {
              beforeError: [
                  async ({error}) => {
                      const {response} = error;
                      if (response) {
                          const detail = readServerDetail(error);
                          error.message = detail || `server answered status ${response.status}`;
                      }
                      return error;
                  },
              ],
          },
      });
  </script>

    const {createApp, ref, computed, nextTick, onMounted, watch} = Vue;

    const CALENDAR_WEEKDAYS = ["Su", "Mo", "Tu", "We", "Th", "Fr", "Sa"];

    function weekdayShort(offsetDays) {
        const date = new Date();
        date.setDate(date.getDate() + offsetDays);
        return CALENDAR_WEEKDAYS[date.getDay()];
    }

    function buildRanges() {
        const ranges = [
            {id: "today", label: "Today", from: 0, to: 0},
            {id: "tomorrow", label: "Tmrw", from: 1, to: 1},
        ];
        for (let offset = 2; offset < 7; offset += 1) {
            ranges.push({
                id: `day-${offset}`,
                label: weekdayShort(offset),
                from: offset,
                to: offset,
            });
        }
        return ranges;
    }

    const RANGES = buildRanges();

    function isoDate(offsetDays) {
        const date = new Date();
        date.setDate(date.getDate() + offsetDays);
        const month = String(date.getMonth() + 1).padStart(2, "0");
        const day = String(date.getDate()).padStart(2, "0");
        return `${date.getFullYear()}-${month}-${day}`;
    }

    const MONTHS = [
        "Jan", "Feb", "Mar", "Apr", "May", "Jun",
        "Jul", "Aug", "Sep", "Oct", "Nov", "Dec",
    ];

    const MELBOURNE = [-37.8136, 144.9631];

    // The OpenStreetMap standard tiles: a short credit and no API key. This
    // tile server does not serve retina tiles, so the URL has no {r}.
    const TILE_URL = "https://tile.openstreetmap.org/{z}/{x}/{y}.png";
    const TILE_ATTRIBUTION =
        '&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a> ' +
        "contributors";

    function escapeHtml(value) {
        return String(value == null ? "" : value)
            .replaceAll("&", "&amp;")
            .replaceAll("<", "&lt;")
            .replaceAll(">", "&gt;");
    }

    function formatDate(value) {
        if (!value) {
            return "";
        }
        const parts = value.split("-");
        if (parts.length !== 3) {
            return value;
        }
        const monthName = MONTHS[Number(parts[1]) - 1];
        return monthName ? `${Number(parts[2])} ${monthName}` : value;
    }

    function tagLine(gig) {
        const tags = [...gig.categories, ...gig.genres];
        const words = [];
        for (const tag of tags) {
            for (const part of String(tag).split("/")) {
                const word = part.trim();
                if (word) {
                    words.push(word);
                }
            }
        }
        return words.join(" / ");
    }

    // The ticket object reports its own label and its own group. This page
    // holds one map from the group to the Bootstrap class, so a new site
    // state needs no change here. The group alone selects the style.
    const TICKET_STYLE = {
        on_sale: {button: "btn-outline-primary", text: "text-muted"},
        limited: {button: "btn-outline-warning", text: "text-warning"},
        unavailable: {button: "btn-outline-secondary", text: "text-muted"},
        free: {button: "btn-outline-success", text: "text-success"},
        unknown: {button: "btn-outline-primary", text: "text-muted"}
    };

    function ticketStyle(ticket) {
        return TICKET_STYLE[ticket.group] || TICKET_STYLE.unknown;
    }

    function ticketButtonClass(ticket) {
        return ticketStyle(ticket).button;
    }

    function ticketTextClass(ticket) {
        return ticketStyle(ticket).text;
    }

    // The price stays in the tooltip when the label hides it.
    function ticketTitle(ticket) {
        return ticket.label === ticket.price ? "" : (ticket.price || "");
    }

    function searchUrl(gig) {
        const query = [gig.artist, ...(gig.categories || []), ...(gig.genres || [])].filter(Boolean).join(" ");
        return `https://www.google.com/search?q=${encodeURIComponent(query)}`;
    }

    async function fetchVenue(venueUrl) {
        const searchParams = {venue_url: venueUrl};
        return window.api.get("venue", {searchParams, timeout: 60000}).json();
    }

    // Yield one NDJSON line at a time from a streaming response.
    async function* readNdjsonLines(response) {
        if (!response.body) {
            throw new Error("server sent no response body");
        }
        const reader = response.body.getReader();
        const decoder = new TextDecoder();
        let buffer = "";
        try {
            let done = false;
            while (!done) {
                const chunk = await reader.read();
                done = chunk.done;
                buffer += decoder.decode(chunk.value, {stream: true});
                const parts = buffer.split("\n");
                buffer = parts.pop();
                yield* parts;
            }
            if (buffer) {
                yield buffer;
            }
        } finally {
            // Runs on a normal end and on `break`, so a stopped
            // consumer frees the socket.
            await reader.cancel().catch(() => {});
        }
    }

    // Wait for the browser to paint the last change.
    function nextPaint() {
        return new Promise((resolve) => {
            if (document.hidden) {
                resolve();
                return;
            }
            requestAnimationFrame(() => resolve());
        });
    }

    // Parse one NDJSON line. None when the line is not complete JSON,
    // which happens when the connection dies in the middle of a line.
    function parseLine(line) {
        try {
            return JSON.parse(line);
        } catch (problem) {
            console.error("bad stream line", line, problem);
            return null;
        }
    }

    function setup() {
        const ranges = ref(RANGES);
        const active = ref("");
        const startDate = ref("");
        const endDate = ref("");
        const gigs = ref([]);
        const loading = ref(false);
        const error = ref("");
        const selectedGig = ref(null);
        const venue = ref({loading: false, data: null, error: ""});
        const streaming = ref(false);
        const markerCount = ref(0);
        let eventRun = 0;
        let eventSource = null;
        const narrowScreen = window.matchMedia("(max-width: 991.98px)");
        const isNarrow = ref(narrowScreen.matches);
        narrowScreen.addEventListener("change", (event) => {
            isNarrow.value = event.matches;
        });
        const activeVenueUrl = ref("");
        const venueInfo = new Map();
        let venueRequest = 0;
        let map = null;
        const markers = new Map();

        const sideWidth = ref(null);
        let dragStartX = 0;
        let dragStartWidth = 0;

        function startDrag(event) {
            const side = document.querySelector(".gig-side");
            if (!side) {
                return;
            }
            dragStartX = event.clientX;
            dragStartWidth = side.getBoundingClientRect().width;
            window.addEventListener("pointermove", onDrag);
            window.addEventListener("pointerup", stopDrag);
            event.preventDefault();
        }

        function onDrag(event) {
            const min = 240;
            const max = Math.max(min, window.innerWidth - 320);
            const wanted = dragStartWidth + (event.clientX - dragStartX);
            sideWidth.value = Math.min(max, Math.max(min, wanted));
        }

        function stopDrag() {
            window.removeEventListener("pointermove", onDrag);
            window.removeEventListener("pointerup", stopDrag);
        }

        const calendarCursor = ref(new Date());
        const todayIso = isoDate(0);

        function shiftMonth(delta) {
            const cursor = calendarCursor.value;
            calendarCursor.value = new Date(cursor.getFullYear(), cursor.getMonth() + delta, 1);
        }

        function pickDay(iso) {
            const range = RANGES.find(
                (item) => (item.start || isoDate(item.from)) === iso,
            );
            load(range || {id: `date-${iso}`, start: iso, end: iso});
        }

        const calendarTitle = computed(() =>
            calendarCursor.value.toLocaleString("en-AU", {month: "long", year: "numeric"})
        );

        const calendarCells = computed(() => {
            const cursor = calendarCursor.value;
            const year = cursor.getFullYear();
            const month = cursor.getMonth();
            const startOffset = new Date(year, month, 1).getDay();
            const daysInMonth = new Date(year, month + 1, 0).getDate();
            const cells = [];
            for (let index = 0; index < startOffset; index += 1) {
                cells.push(null);
            }
            for (let day = 1; day <= daysInMonth; day += 1) {
                const monthText = String(month + 1).padStart(2, "0");
                const dayText = String(day).padStart(2, "0");
                cells.push({iso: `${year}-${monthText}-${dayText}`, day});
            }
            return cells;
        });

        function load(range) {
            active.value = range.id;
            startDate.value = range.start || isoDate(range.from);
            endDate.value = range.end || isoDate(range.to);
            loading.value = true;
            error.value = "";
            selectedGig.value = null;
            venue.value = {loading: false, data: null, error: ""};
            if (map) {
                for (const marker of markers.values()) {
                    marker.remove();
                }
                markers.clear();
            }
            markerCount.value = 0;
            activeVenueUrl.value = "";
            venueInfo.clear();
            gigs.value = [];
            list.setRoom(0);
            loadEvents();
        }

        function timeValue(time) {
            const match = /^(\d{1,2})(?::(\d{2}))?(am|pm)$/.exec(String(time || "").trim().toLowerCase());
            if (!match) {
                return Number.MAX_SAFE_INTEGER;
            }
            let hour = Number(match[1]) % 12;
            if (match[3] === "pm") {
                hour += 12;
            }
            return hour * 60 + Number(match[2] || 0);
        }

        const sortKey = ref("time");
        const sortDir = ref("asc");

        function toggleSort(key) {
            if (sortKey.value === key) {
                sortDir.value = sortDir.value === "asc" ? "desc" : "asc";
            } else {
                sortKey.value = key;
                sortDir.value = "asc";
            }
            // A sort moves the selected row. Bring it back into view after
            // Vue writes the new order.
            nextTick(() => scrollToSelectedGig());
        }

        function priceValue(ticket) {
            const value = ticket ? ticket.price_min : null;
            return value == null ? Number.MAX_SAFE_INTEGER : value;
        }

        function compareGigs(left, right) {
            const direction = sortDir.value === "asc" ? 1 : -1;
            if (sortKey.value === "time") {
                const dateOrder = String(left.date || "").localeCompare(String(right.date || ""));
                if (dateOrder !== 0) {
                    return dateOrder * direction;
                }
                if (!left.time && !right.time) {
                    return 0;
                }
                if (!left.time) {
                    return 1;
                }
                if (!right.time) {
                    return -1;
                }
                return (timeValue(left.time) - timeValue(right.time)) * direction;
            }
            if (sortKey.value === "price") {
                return (priceValue(left.ticket) - priceValue(right.ticket)) * direction;
            }
            return String(left[sortKey.value] || "").localeCompare(String(right[sortKey.value] || "")) * direction;
        }

        const visibleGigs = computed(() => {
            if (!sortKey.value) {
                return gigs.value;
            }
            return [...gigs.value].sort(compareGigs);
        });

        const visibleRows = computed(() => (loading.value ? [] : visibleGigs.value));
        watch([visibleRows, loading], () => nextTick(syncScroll));

        const busy = computed(() => loading.value || streaming.value);

        const gigsText = computed(() => {
            if (loading.value || !gigs.value.length) {
                return "";
            }
            return `${gigs.value.length} gigs`;
        });

        const venuesText = computed(() => {
            if (loading.value || !markerCount.value) {
                return "";
            }
            return `in ${markerCount.value} venues`;
        });

        const statusText = computed(
            () => [gigsText.value, venuesText.value].filter(Boolean).join(" "),
        );

        function actsAt(venueUrl) {
            const acts = [];
            for (const gig of gigs.value) {
                if (gig.venue_url !== venueUrl || !gig.artist) {
                    continue;
                }
                acts.push({
                    time: gig.time || "",
                    artist: gig.artist,
                    order: timeValue(gig.time),
                });
            }
            acts.sort((left, right) => left.order - right.order);
            return acts;
        }

        function addMarker(data) {
            // Hold every venue, so a click costs no request, even when the
            // venue has no place on the map.
            venueInfo.set(data.venue_url, data);
            if (!map || !data.latitude || !data.longitude) {
                return;
            }
            const marker =
                markers.get(data.venue_url) ||
                L.marker([data.latitude, data.longitude]).addTo(map);
            const name = escapeHtml(data.name || "Venue");
            const address = escapeHtml(data.address || "");
            const acts = actsAt(data.venue_url);
            let popup = '<table class="gig-popup">';
            for (const act of acts) {
                popup += `<tr><td>${escapeHtml(act.time)}</td><td>${escapeHtml(act.artist)}</td></tr>`;
            }
            popup += '<tr class="gig-popup-venue"><td>Venue</td>';
            popup += `<td>${name}${address ? `<br>${address}` : ""}</td></tr>`;
            popup += "</table>";
            marker.bindPopup(popup);
            marker.on("click", () => focusVenue(data.venue_url));
            markers.set(data.venue_url, marker);
            markerCount.value = markers.size;
        }

        // The narrow layout shows a shadow on an edge when rows are hidden past it.
        const scrollEdges = ref({above: false, below: false});
        const frameClass = computed(() => ({
            "has-above": scrollEdges.value.above,
            "has-below": scrollEdges.value.below,
        }));

        // One place for every list scroll. A reveal moves the list box, opens
        // the room below the table, and moves the page in the narrow layout, so
        // the row stays in view under the venue bar.
        const page = document.scrollingElement || document.documentElement;
        const smoothScroll = "scrollBehavior" in document.documentElement.style;

        // Move one scroll owner to a value. A smooth move corrects itself when
        // it stops, because iOS Safari can drop it during a momentum scroll.
        function moveScroll(owner, top) {
            const target = Math.round(top);
            if (!smoothScroll) {
                owner.scrollTop = target;
                return;
            }
            owner.scrollTo({top: target, behavior: "smooth"});
            const view = owner === page ? window : owner;
            let timer = 0;
            const stop = () => {
                view.removeEventListener("scrollend", check);
                view.removeEventListener("touchstart", stop);
                clearTimeout(timer);
            };
            const check = () => {
                stop();
                if (Math.abs(owner.scrollTop - target) > 2) {
                    owner.scrollTop = target;
                }
            };
            view.addEventListener("scrollend", check);
            view.addEventListener("touchstart", stop, {passive: true});
            timer = setTimeout(stop, 1500);
        }

        // A touch after the tap means the reader moved the list. Do not move
        // the list again for that reader.
        let touched = false;
        window.addEventListener(
            "touchstart",
            () => {
                touched = true;
            },
            {passive: true},
        );

        const list = {
            box() {
                return document.querySelector(".gig-scroll");
            },
            edges() {
                const box = this.box();
                if (!box) {
                    return;
                }
                const above = box.scrollTop > 1;
                const below = box.scrollTop + box.clientHeight < box.scrollHeight - 1;
                if (above !== scrollEdges.value.above || below !== scrollEdges.value.below) {
                    scrollEdges.value = {above, below};
                }
            },
            // Only the narrow layout needs room below the last row, because it
            // puts a row at the first line of a box that the page shows.
            setRoom(pixels) {
                const room = document.querySelector(".scroll-room");
                if (room) {
                    room.style.height = isNarrow.value ? `${Math.max(0, pixels)}px` : "0px";
                }
                this.edges();
            },
            // The sticky header covers the top of the list box, so a top
            // alignment measures from the bottom edge of the header.
            rowTop(row, box) {
                const head = box.querySelector("thead");
                const headHeight = head ? head.getBoundingClientRect().height : 0;
                return row.getBoundingClientRect().top - box.getBoundingClientRect().top - headHeight;
            },
            // The room below the table lets the last row reach the top.
            // Measure the table alone first, so the room is exact.
            openRoom(row, box) {
                this.setRoom(0);
                if (box.scrollHeight <= box.clientHeight) {
                    return;
                }
                const short =
                    this.rowTop(row, box) +
                    box.scrollTop -
                    (box.scrollHeight - box.clientHeight);
                this.setRoom(short);
            },
            // The narrow layout scrolls the page as well as the list box. Move
            // the page only when the venue bar above the box is above the
            // screen, so the venue stays beside the rows.
            showBox(box) {
                if (!isNarrow.value) {
                    return;
                }
                const bar = document.querySelector(".venue-bar");
                const margin = bar ? bar.getBoundingClientRect().height : 0;
                const belowBar = box.getBoundingClientRect().top - margin;
                if (belowBar >= 0) {
                    return;
                }
                moveScroll(page, page.scrollTop + belowBar - 4);
            },
            // Put one row where the reader looks. "top" keeps the row at the
            // first line of the box. "center" puts the row in the middle of the
            // box, which the wide layout always shows in full.
            reveal(row, align) {
                const box = this.box();
                if (!row || !box) {
                    return;
                }
                if (align === "center") {
                    const bounds = row.getBoundingClientRect();
                    const middle = box.getBoundingClientRect().top + box.clientHeight / 2;
                    const delta = bounds.top + bounds.height / 2 - middle;
                    if (Math.abs(delta) > 1) {
                        moveScroll(box, box.scrollTop + delta);
                    }
                    return;
                }
                this.openRoom(row, box);
                this.showBox(box);
                // Read again: the room changed the scroll limit.
                const delta = this.rowTop(row, box);
                if (Math.abs(delta) > 1) {
                    moveScroll(box, box.scrollTop + delta);
                }
            },
            // The table row at one place in the visible order.
            rowAt(index) {
                const box = this.box();
                if (!box) {
                    return null;
                }
                return box.querySelectorAll("tbody tr")[index] || null;
            },
            // The first table row of one venue.
            rowOfVenue(venueUrl) {
                const box = this.box();
                if (!box) {
                    return null;
                }
                for (const row of box.querySelectorAll("tbody tr")) {
                    if (row.dataset.venueUrl === venueUrl) {
                        return row;
                    }
                }
                return null;
            },
        };

        const syncScroll = () => list.edges();
        watch(isNarrow, () => list.setRoom(0));

        function scrollToVenue(venueUrl) {
            const row = list.rowOfVenue(venueUrl);
            if (row) {
                list.reveal(row, isNarrow.value ? "top" : "center");
            }
        }

        // After a sort, bring the selected gig back into the list box.
        function scrollToSelectedGig() {
            const gig = selectedGig.value;
            if (!gig) {
                return;
            }
            const index = visibleRows.value.indexOf(gig);
            if (index < 0) {
                return;
            }
            const row = list.rowAt(index);
            if (row) {
                list.reveal(row, "top");
            }
        }

        async function focusVenue(venueUrl) {
            activeVenueUrl.value = venueUrl;
            const gig = gigs.value.find((item) => item.venue_url === venueUrl);
            if (gig) {
                selectedGig.value = gig;
            }
            const data = venueInfo.get(venueUrl);
            if (data) {
                venue.value = {loading: false, data, error: ""};
            }
            // The venue name and the address changed the height above the
            // list. Measure after Vue writes the change to the page.
            await nextTick();
            scrollToVenue(venueUrl);
        }

        // The map eases out to the markers as they arrive. A gesture from the
        // user stops that, so the view stays where it is.
        let viewStopped = false;
        let lastFit = 0;
        // Leaflet keeps the animation flag until the zoom animation ends, and
        // it drops a setView that lands during that time. So the app reads the
        // flag from the events and holds a dropped fit until the end.
        let zooming = false;
        let fitQueued = false;

        // The view that the markers ask for. A fit of one venue has a point
        // for bounds, and Leaflet then goes to the deepest zoom, so the zoom
        // is capped and the first marker does not open on one street.
        function venueView() {
            const group = L.featureGroup([...markers.values()]);
            const bounds = group.getBounds().pad(0.15);
            return {
                center: bounds.getCenter(),
                zoom: Math.min(map.getBoundsZoom(bounds), 15),
            };
        }

        function fitVenues() {
            // A gesture from the user ends the fitting for this load.
            if (viewStopped || markers.size === 0) {
                return;
            }
            if (zooming) {
                // The running animation ends with zoomend. Fit again then, so
                // the last fit of a stream always lands.
                if (!fitQueued) {
                    fitQueued = true;
                    const applyFit = () => {
                        if (!fitQueued) {
                            return;
                        }
                        fitQueued = false;
                        fitVenues();
                    };
                    map.once("zoomend", applyFit);
                    map.once("moveend", applyFit);
                }
                return;
            }
            const view = venueView();
            map.setView(view.center, view.zoom);
        }

        function stopFitting() {
            viewStopped = true;
        }

        // A fit makes none of these gestures, so each one is the user.
        // The one finger touch pan comes as dragstart.
        function watchGestures() {
            map.on("dragstart dblclick", stopFitting);
            map.on("zoomstart", () => {
                zooming = true;
            });
            map.on("zoomend", () => {
                zooming = false;
            });
            const container = map.getContainer();
            container.addEventListener("wheel", stopFitting, {passive: true});
            container.addEventListener(
                "touchstart",
                (event) => {
                    if (event.touches.length > 1) {
                        stopFitting();
                    }
                },
                {passive: true},
            );
            // The zoom buttons sit inside the map.
            container.addEventListener("click", (event) => {
                if (event.target.closest(".leaflet-control-zoom")) {
                    stopFitting();
                }
            });
        }

        function stopEvents() {
            eventRun += 1;
            if (eventSource) {
                eventSource.abort();
                eventSource = null;
            }
            streaming.value = false;
        }

        async function loadEvents() {
            stopEvents();
            const runId = eventRun;
            viewStopped = false;
            lastFit = 0;
            eventSource = new AbortController();
            streaming.value = true;
            try {
                // One stream for the whole range. The server makes one
                // detail read for each gig and one venue read for each
                // venue, and sends the line of a gig when its own two
                // values are ready. The geocoder holds its own limit.
                const response = await window.api.get("events", {
                    searchParams: {
                        start_date: startDate.value,
                        end_date: endDate.value,
                    },
                    timeout: false,
                    signal: eventSource.signal,
                });
                for await (const line of readNdjsonLines(response)) {
                    if (runId !== eventRun) {
                        break;
                    }
                    if (!line.trim()) {
                        continue;
                    }
                    const update = parseLine(line);
                    if (update === null) {
                        continue;
                    }
                    // Each line holds the whole gig, so the row needs
                    // no other read.
                    const gig = update.gig;
                    if (gig) {
                        gigs.value.push(gig);
                    }
                    // The first row stops the loading state, so the table
                    // shows each row as it arrives.
                    loading.value = false;
                    if (update.venue) {
                        addMarker(update.venue);
                    } else if (update.error) {
                        console.error("venue lookup failed", gig ? gig.venue_url : "", update.error);
                    }
                    // Let the browser paint, so a row and its marker appear
                    // together, even when one chunk holds many lines.
                    await nextPaint();
                    // Ease the view to the markers so far. Five moves a
                    // second keep the zoom smooth, and a slow stream
                    // still shows each step.
                    const now = performance.now();
                    if (now - lastFit >= 200) {
                        lastFit = now;
                        fitVenues();
                    }
                }
                if (runId === eventRun) {
                    fitVenues();
                }
            } catch (problem) {
                if (problem.name !== "AbortError") {
                    console.error("event stream failed", problem);
                    // No row arrived, so the page has no table to keep.
                    if (runId === eventRun && !gigs.value.length) {
                        error.value = `Could not load the gig guide: ${problem.message}`;
                    }
                }
            } finally {
                if (runId === eventRun) {
                    eventSource = null;
                    streaming.value = false;
                    loading.value = false;
                }
            }
        }

        function showOnMap(data) {
            addMarker(data);
            if (data.latitude && data.longitude && markers.has(data.venue_url)) {
                map.setView([data.latitude, data.longitude], 16);
                markers.get(data.venue_url).openPopup();
            }
        }

        async function selectGig(gig, event) {
            selectedGig.value = gig;
            activeVenueUrl.value = gig.venue_url || "";
            const row = isNarrow.value && event ? event.currentTarget : null;
            // The tap fires touchstart before click. Clear the mark, so a
            // later touch can cancel the move below.
            touched = false;
            // The summary above the list changes height at each step of the
            // lookup, so the row is put back after Vue writes the change.
            const holdRow = async () => {
                if (!row || touched) {
                    return;
                }
                await nextTick();
                list.reveal(row, "top");
            };
            if (!gig.venue_url) {
                venue.value = {
                    loading: false,
                    data: null,
                    error: "This gig has no venue link.",
                };
                await holdRow();
                return;
            }
            venueRequest += 1;
            const requestId = venueRequest;
            // The map load already holds the venue, so a click costs no
            // request.
            const cached = venueInfo.get(gig.venue_url);
            if (cached) {
                venue.value = {loading: false, data: cached, error: ""};
                showOnMap(cached);
                await holdRow();
                return;
            }
            venue.value = {loading: true, data: null, error: ""};
            await holdRow();
            try {
                const data = await fetchVenue(gig.venue_url);
                if (venueRequest !== requestId) {
                    return;
                }
                venue.value = {loading: false, data, error: ""};
                await holdRow();
                showOnMap(data);
            } catch (problem) {
                if (venueRequest === requestId) {
                    venue.value = {
                        loading: false,
                        data: null,
                        error: `Could not load the venue: ${problem.message}`,
                    };
                    await holdRow();
                }
            }
        }

        onMounted(() => {
            map = L.map("map").setView(MELBOURNE, 11);
            watchGestures();
            L.tileLayer(TILE_URL, {
                maxZoom: 19,
                attribution: TILE_ATTRIBUTION,
            }).addTo(map);
            new ResizeObserver(() => {
                window.requestAnimationFrame(() => map.invalidateSize());
            }).observe(document.getElementById("map"));
            load(RANGES.find((range) => range.id === "today") || RANGES[0]);
            new ResizeObserver(syncScroll).observe(document.querySelector(".gig-scroll"));
        });

        return {
            ranges,
            active,
            startDate,
            endDate,
            gigs,
            loading,
            error,
            load,
            selectedGig,
            venue,
